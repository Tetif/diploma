services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_BASE_URL=http://localhost:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./microservice_storage:/app/microservice_storage
      - ./experiment_logs:/app/experiment_logs
      - ./data_cache:/app/data_cache
    command: >
      sh -c "python microservice/run_api.py"
    healthcheck:
      # python:slim не содержит curl; urllib из stdlib
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./microservice_storage:/app/microservice_storage
    command: >
      sh -c "python microservice/run_ui.py"
